<h1>비밀번호 변경</h1>
{% if must %}
<p class="notice">임시 비밀번호로 들어왔습니다. 바꾸기 전에는 다른 화면이 열리지 않습니다.</p>
{% endif %}
<form method="post" action="/password">
  <input type="hidden" name="csrf" value="{{ page.csrf_token }}">
  <label>새 비밀번호 <input type="password" name="secret" required minlength="8"></label>
  <button type="submit">바꾸기</button>
</form>
<p class="muted">잊으면 CLI 에서 재설정합니다 — <code>python run.py admin reset --name 마스터</code></p>
