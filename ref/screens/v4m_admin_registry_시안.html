<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리 · 등록부 시안</title>
<style>
:root{--bg:#0f1114;--surface:#15181d;--surface2:#1b1f25;--line:#2a2f37;--line2:#3a414b;
--text:#e8eaed;--dim:#9aa3ad;--faint:#6b747e;--amber:#f0b429;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);
font:15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.v4-wrap{width:100%;max-width:1180px;margin:0 auto;background:var(--bg);
min-height:100vh;padding-bottom:64px}
.v4-top{position:sticky;top:0;z-index:9;background:var(--bg);
padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.v4-title{font-size:17px;font-weight:700}
.v4-sub{font-size:12px;color:var(--dim);margin-top:2px}

/* 탭 — 글자가 넘치면 두 줄로 */
.rc-tabs{display:flex;border-bottom:1px solid var(--line)}
.rc-tabs a{flex:1;text-align:center;padding:6px 5px;font-size:12.5px;line-height:1.25;
color:var(--dim);text-decoration:none;border-bottom:2px solid transparent;
min-height:44px;max-height:44px;display:flex;align-items:center;justify-content:center;
word-break:keep-all;overflow-wrap:break-word}
.rc-tabs a.on{color:var(--amber);border-bottom-color:var(--amber);font-weight:600}

/* 차종 단추 — 줄이 모자라면 두 줄로 접힌다 (가로 스크롤 아님) */
.rc-models{display:flex;flex-wrap:wrap;gap:5px;padding:8px 14px;
border-bottom:1px solid var(--line);max-height:82px;overflow:hidden;position:relative}
.rc-models.open{max-height:none}
.rc-more{display:block;text-align:center;font-size:11px;color:var(--faint);
padding:6px 0 8px;border-bottom:1px solid var(--line);text-decoration:none;background:var(--bg)}
.rc-models .mb{font-size:12px;line-height:1.25;color:var(--dim);text-decoration:none;
background:var(--surface2);border:1px solid var(--line);border-radius:16px;
padding:5px 10px;min-height:34px;display:inline-flex;align-items:center;gap:4px;
white-space:normal;word-break:keep-all;max-width:100%}
.rc-models .mb b{font-weight:600;color:var(--text);font-size:11px}
.rc-models .mb.on{border-color:var(--amber);color:var(--amber);background:rgba(240,180,41,.08)}
.rc-models .mb.on b{color:var(--amber)}
.rc-models .mb.off{opacity:.45}

.rc-head{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);
font-size:12px;color:var(--dim);line-height:1.6}
.rc-head b{color:var(--text)}

/* 카드 — 목록과 같은 꼴.  사진 옆을 다 쓴다 */
.v4-card{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
.v4-row{display:block}
.v4-row::after{content:'';display:block;clear:both}
.v4-thumbwrap{position:relative;float:left;width:104px;margin:0 10px 6px 0}
.v4-thumb{width:104px;height:78px;border-radius:8px;background:var(--surface2);
border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
font-size:11px;color:var(--faint)}
.v4-pick{position:absolute;left:4px;bottom:4px;width:24px;height:24px;border-radius:6px;
background:rgba(0,0,0,.6);border:1px solid var(--line2);color:var(--dim);font-size:12px}
.v4-mid{min-width:0;overflow:visible}
.rc-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.rc-score{font-size:15px;font-weight:700;color:var(--amber)}
.rc-grade{font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;
border:1px solid var(--line2);color:var(--dim)}
.rc-grade.hi{border-color:var(--amber);color:var(--amber)}
.rc-grade.lo{opacity:.5}
.v4-heart{margin-left:auto;color:var(--faint);font-size:16px}
.v4-name{font-size:14px;font-weight:600}
.v4-trim{font-size:12px;color:var(--dim)}
.v4-spec{font-size:12px;color:var(--dim)}
.v4-price{font-size:16px;font-weight:700;margin-top:3px}
.v4-j{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:4px;font-size:10.5px;color:var(--dim);line-height:1.4}
.v4-j b.ok{color:var(--ok)} .v4-j b.na{color:var(--faint)}
.rc-why{font-size:11px;color:var(--faint);margin-top:6px;display:inline-block;text-decoration:none}
.rc-axes{display:none;gap:5px;flex-wrap:wrap;margin-top:5px}
.v4-card.open .rc-axes{display:flex}
.v4-card.open .rc-bar{display:block}
.rc-ax{font-size:11px;color:var(--dim);background:var(--surface2);
border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.rc-ax b{color:var(--text);font-weight:600}
.rc-ax.hi{border-color:var(--amber);color:var(--amber)} .rc-ax.hi b{color:var(--amber)}
.rc-ax.na{opacity:.45}
.rc-bar{display:none;height:3px;background:var(--surface2);border-radius:2px;margin-top:6px;overflow:hidden}
.rc-bar i{display:block;height:100%;background:var(--amber)}

.v4-tabs{position:fixed;bottom:0;left:0;right:0;max-width:1180px;margin:0 auto;
display:flex;background:var(--surface);border-top:1px solid var(--line2)}
.v4-tabs a{flex:1;text-align:center;padding:9px 0 11px;font-size:11px;
color:var(--dim);text-decoration:none}
.v4-tabs a.on{color:var(--amber)}
.v4-tabs b{display:block;font-size:17px;line-height:1.2;font-weight:400}

/* ★ 좁은 화면 (360px 아래) — 줄을 줄인다 */
@media (max-width:359px){
  .v4-thumbwrap{width:84px;margin:0 8px 5px 0}
  .v4-thumb{width:84px;height:63px}
  .v4-name{font-size:13px}
  .v4-trim,.v4-spec{font-size:11px;line-height:1.35}
  .v4-j{font-size:10px;gap:2px 6px}
  .rc-score{font-size:14px}
  .v4-price{font-size:15px}
  .rc-models{max-height:76px;padding:7px 12px}
  .v4-card{padding:10px 12px}
}

.v4-why-empty,.rc-why-empty,.lst-why-empty,.wch-why-empty,.trk-why-empty,.sld-why-empty,.adm-note,.rc-rank-note{font-size:11px;line-height:1.45;color:var(--faint);opacity:.72;font-weight:400;margin:3px 0}
.v4-why-empty b,.rc-why-empty b,.lst-why-empty b,.wch-why-empty b,.trk-why-empty b,.sld-why-empty b,.adm-note b{font-weight:600;color:var(--dim)}



/* ★★★★★★ 09-04 — ★ **높이·너비를 고정하지 않는다** (마스터 확정 · RULES.md 2-4)
   ★ 실측 09-04 — ★ 손대기 전 시안 ★ **64** → ★ 이 줄들로 ★ **57**
   ★ ★ 배포는 ★ **63** 이다 — ★ 뿌리가 같다 (어미보다 자식이 크다) */
*{min-height:0}
body,div,span,p,a,b,u,li,td{height:auto;overflow:visible}
.rc-why-empty,.lst-why-empty,.trk-why-empty,.wch-why-empty,.sld-why-empty,
.v4-why-empty,.adm-note,.lst-pairhead{line-height:1.5;overflow:visible;height:auto}
.rc-models,.lst-chips{max-height:none;overflow:visible}
.v4-card,.lst-card,.rc-card{overflow:visible}
.v4-line,.v4-sec,.meta,.dim,.gr{height:auto;line-height:1.4;overflow:visible}
</style>
</head>
