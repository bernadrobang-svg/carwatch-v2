<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v4m 미판정 시안 — 모바일 기준</title>
<style>
:root{--bg:#0f1114;--surface:#15181d;--surface2:#1b1f25;--line:#2a2f37;--line2:#3a414b;
--text:#e8eaed;--dim:#9aa3ad;--faint:#6b747e;--amber:#f0b429;--ok:#4ade80;--no:#f87171;
--mono:ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);
font:15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.v4-wrap{width:100%;max-width:1180px;margin:0 auto;background:var(--bg);
min-height:100vh;padding-bottom:64px;position:relative}
.v4-note{font-size:12px;color:var(--faint);line-height:1.6}

.v4-top{position:sticky;top:0;z-index:9;background:var(--bg);
padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.v4-title{font-size:17px;font-weight:700}
.v4-sub{font-size:12px;color:var(--dim);margin-top:2px}

.v4-tabs{position:fixed;bottom:0;left:0;right:0;max-width:1180px;margin:0 auto;
display:flex;background:var(--surface);border-top:1px solid var(--line2);z-index:10}
.v4-tabs a{flex:1;text-align:center;padding:9px 0 11px;font-size:11px;
color:var(--dim);text-decoration:none}
.v4-tabs a.on{color:var(--amber)}
.v4-tabs b{display:block;font-size:17px;line-height:1.2;font-weight:400}

.v4-cards{display:block}
.v4-card{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
.v4-chg{font-size:14px;font-weight:700;margin-bottom:6px}
.v4-chg.dn{color:var(--ok)} .v4-chg.up{color:var(--no)}
.v4-chg.gone{color:var(--no)} .v4-chg.same{color:var(--faint);font-weight:400;font-size:13px}
.v4-row{display:flex;gap:10px}
.v4-thumb{width:104px;height:78px;flex:0 0 104px;border-radius:8px;
background:var(--surface2);border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint)}
.v4-mid{flex:1;min-width:0}
.v4-name{font-size:14px;font-weight:600}
.v4-spec{font-size:12px;color:var(--dim);margin-top:2px}
.v4-price{font-size:16px;font-weight:700;margin-top:4px}
.v4-was{font-size:12px;color:var(--faint);text-decoration:line-through;font-weight:400}
.v4-since{font-size:11px;color:var(--faint);margin-top:6px}
.v4-gr{display:inline-block;background:var(--amber);color:#111;font-weight:700;
border-radius:4px;padding:0 6px;font-size:12px;margin-right:5px}
.v4-acts{display:flex;gap:8px;margin-top:10px}
.v4-btn{flex:1;min-height:44px;background:var(--surface2);border:1px solid var(--line2);
border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
.v4-btn.go{background:var(--amber);border-color:var(--amber);color:#111;font-weight:600}
.v4-seg{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.v4-seg button{min-height:36px;white-space:nowrap;background:var(--surface2);
border:1px solid var(--line2);border-radius:18px;color:var(--dim);font-size:12.5px;padding:0 12px}
.v4-seg button.on{background:var(--amber);border-color:var(--amber);color:#111;font-weight:600}
.v4-box{margin:12px 14px;padding:11px 12px;border:1px solid var(--amber);
border-radius:10px;background:var(--surface)}
.v4-lbl{font-size:12px;color:var(--dim);margin-bottom:5px}
.v4-ax{font-size:11px;color:var(--faint);font-family:var(--mono);margin-bottom:3px}
.v4-ax b{color:var(--dim);font-weight:600}
.v4-heart{color:var(--amber);float:right}
.v4-thumbwrap{position:relative;flex:0 0 auto}
.v4-pick{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:6px;
background:rgba(0,0,0,.55);border:1px solid var(--line2);color:var(--dim);font-size:14px;z-index:2}
.v4-pick.on{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}
.v4-cmp{position:sticky;bottom:64px;margin:0;padding:10px 14px;background:var(--surface2);
border-top:1px solid var(--amber);display:flex;gap:10px;align-items:center;z-index:8}
.v4-cmp b{color:var(--amber)}
.v4-trim{font-size:12px;color:var(--dim);margin-top:1px}
.v4-j{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:5px;font-size:11px;color:var(--faint)}
.v4-j b.ok{color:var(--ok)} .v4-j b.no{color:var(--no)}

/* ★★★ 모바일이 기준이다.  ★ 넓어지면 ★ 카드가 「옆으로 펴진다」
   ★ 카드를 옆으로 붙이지 않는다 — ★ 한 줄에 늘 하나 (마스터 확정 08-25) */

/* ★ 640 이상 — 사진을 키우고 · 판정을 한 줄로 · 메뉴를 위로 */
@media (min-width:640px){
  .v4-wrap{padding-bottom:0}
  .v4-top{padding:14px 22px 10px}
  .v4-title{font-size:20px}
  .v4-card{padding:16px 22px}
  .v4-thumb{width:180px;height:135px;flex:0 0 180px}
  .v4-name{font-size:16px}
  .v4-price{font-size:19px}
  .v4-j{flex-wrap:nowrap}
  .v4-box,.v4-seg{padding-left:22px;padding-right:22px}
  .v4-box{margin-left:22px;margin-right:22px}
  h3{margin-left:22px}
  /* ★ 단추를 오른쪽으로 — 카드가 가로로 펴진다 */
  .v4-acts{margin-top:0;flex:0 0 200px;flex-direction:column;justify-content:center}
  .v4-card>.v4-row{align-items:flex-start}
  .v4-cardline{display:flex;gap:18px;align-items:stretch}
  .v4-tabs{position:static;border-top:0;border-bottom:1px solid var(--line);
    background:transparent;justify-content:flex-start;padding:0 22px}
  .v4-tabs a{flex:0 0 auto;padding:11px 15px;font-size:13.5px}
  .v4-tabs b{display:none}
}

/* ★ 1024 이상 — 사진을 더 키우고 · 곁말을 옆에 편다 */
@media (min-width:1024px){
  .v4-card{padding:18px 26px}
  .v4-thumb{width:240px;height:180px;flex:0 0 240px}
  .v4-name{font-size:17px}
  .v4-trim,.v4-spec{font-size:13px}
  .v4-price{font-size:21px}
  .v4-j{gap:4px 14px;font-size:12px}
  .v4-ax{font-size:12px}
  .v4-acts{flex:0 0 240px}
  .v4-box,.v4-seg{padding-left:26px;padding-right:26px}
  .v4-box{margin-left:26px;margin-right:26px}
  h3{margin-left:26px}
  .v4-tabs{padding:0 26px}
}

h3{font-size:13px;font-weight:600;margin:18px 14px 6px;color:var(--dim)}

/* ★★★ 세 구간 — 마스터 확정 08-25
   ★ 정보를 빼지 않는다.  ★ 자리만 바꾼다 */

/* ★ 340 아래에서도 안 깨진다 — 사진만 줄인다.  글자는 그대로 */
@media (max-width:359px){
  .v4-thumb{width:88px;height:66px;flex:0 0 88px}
  .v4-price{font-size:15px}
  .v4-btn{font-size:12px}
}



.v4-fil{padding:8px 14px;border-bottom:1px solid var(--line)}
.v4-fil select,.v4-fil input{width:100%;min-height:40px;background:var(--surface2);
border:1px solid var(--line2);border-radius:8px;color:var(--text);font-size:13px;
padding:0 10px;font-family:inherit;margin-bottom:6px}
.v4-g2{display:flex;gap:6px}.v4-g2 input{flex:1}
.v4-more{width:100%;min-height:44px;background:var(--surface2);border:1px solid var(--line2);
border-radius:8px;color:var(--amber);font-size:13px;font-family:inherit;margin-top:2px}
.v4-sec{border-bottom:1px solid var(--line);padding:12px 14px}
.v4-kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;
border-bottom:1px solid var(--line)}
.v4-kv:last-child{border-bottom:0}
.v4-kv b{font-weight:600}
.v4-big{font-size:26px;font-weight:700}
.v4-photo{width:100%;aspect-ratio:16/9;background:var(--surface2);border:1px solid var(--line);
border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
@media (min-width:640px){.v4-fil{padding:10px 22px}.v4-sec{padding:14px 22px}
 .v4-fil form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
 .v4-photo{max-width:520px}}
@media (min-width:1024px){.v4-fil{padding:12px 26px}.v4-sec{padding:16px 26px}
 .v4-fil form{grid-template-columns:repeat(5,1fr)}.v4-photo{max-width:640px}}
</style></head><body>
<div class="v4-wrap">
<div class="v4-top"><div class="v4-title">미판정</div><div class="v4-sub">★ 여쭐 것 <b style='color:#4ade80'>0건</b></div></div>
<nav class="v4-tabs"><a href="#"><b>≡</b>매물</a><a href="#"><b>♥</b>관심</a><a href="#"><b>⇄</b>추적</a><a href="#"><b>◔</b>현황</a><a href="#"><b>⚙</b>관리</a></nav>
<div class="v4-box"><div class="v4-lbl">★ 이 화면은 무엇을 하는 곳인가</div>
<div class="v4-note">★ <b>판정에 못 들어간 것</b>을 본다<br>★ ★ <b>「여쭐 것」만 마스터께서 보시면 된다</b> — 나머지 둘은 이미 정해진 것이다</div></div>
<div class="v4-sec" style="border:1px solid var(--amber);border-radius:10px;margin:12px 14px">
<div class="v4-lbl">★★ 여쭐 것</div><div class="v4-big" style="color:var(--ok)">0건</div>
<div class="v4-note">차종을 모르는데 <b>아직 아무 처리도 안 된</b> 매물이다<br>
★ 있으면 <b>마스터께서 「받을까 말까」를 정하신다</b></div></div>
<div class="v4-sec"><div class="v4-lbl">접어 둔 것 (갈래가 달라 뺐다)</div>
<div class="v4-kv"><span>out_of_scope</span><b>8,385건</b></div>
<div class="v4-note">★ <b>지운 것이 아니다.</b>  갈래를 넓히시면 되살아난다</div></div>
<div class="v4-sec"><div class="v4-lbl">팔린 것</div>
<div class="v4-kv"><span>gone</span><b>115건</b></div></div>
<div class="v4-sec"><div class="v4-lbl">등록부 미분류 (사전이 막는 것)</div>
<div class="v4-kv"><span>dict_enum 대기</span><b>319건</b></div></div>
</div></body></html>
